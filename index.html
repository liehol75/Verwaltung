<script>
/* PWA-Icon & Manifest zur Laufzeit erzeugen – keine externen Dateien nötig */
(function(){
  var svgMarkup =
    '<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="#4d7cf0"/><stop offset="1" stop-color="#16234a"/>' +
    '</linearGradient></defs>' +
    '<rect width="180" height="180" rx="40" fill="url(#g)"/>' +
    '<text x="90" y="128" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="102" font-weight="700" fill="#ffffff" text-anchor="middle">\u20AC</text>' +
    '</svg>';

  var iconUrl = 'data:image/svg+xml,' + encodeURIComponent(svgMarkup);

  var manifest = {
    name: 'FinanzPlan',
    short_name: 'FinanzPlan',
    start_url: '.',
    display: 'standalone',
    background_color: '#101827',
    theme_color: '#101827',
    icons: [
      { src: iconUrl, sizes: '180x180', type: 'image/svg+xml' },
      { src: iconUrl, sizes: '512x512', type: 'image/svg+xml' }
    ]
  };

  var manifestUrl = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));

  function addLink(rel, href){
    var l = document.createElement('link');
    l.rel = rel;
    l.href = href;
    document.head.appendChild(l);
  }

  addLink('apple-touch-icon', iconUrl);
  addLink('icon', iconUrl);
  addLink('manifest', manifestUrl);
})();
</script>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<style>
:root{
  --bg:#f4f6f8;
  --bg-soft:#fafbfc;
  --card:#fff;
  --ink:#152033;
  --muted:#6b7482;
  --line:#e4e8ee;

  --accent:#356ae6;
  --accent2:#214bb5;
  --accent-soft-bg:#eaf0ff;
  --accent-soft-border:#9db5fa;
  --accent-soft-text:#2349ad;

  --good:#18864b;
  --good-soft-bg:#edf9f2;
  --good-soft-text:#176b3e;

  --warn:#bd7b00;
  --warn-soft-bg:#fff6df;
  --warn-soft-text:#8a5c00;

  --bad:#c43d4b;
  --bad-soft-bg:#fbecee;
  --bad-soft-text:#c43d4b;
  --bad-soft-border:#f2cdd2;

  --shadow:0 8px 28px rgba(22,32,51,.08);
  --radius:18px;

  color-scheme:light;
}

[data-theme="dark"]{
  --bg:#0b0f16;
  --bg-soft:#121826;
  --card:#161c27;
  --ink:#eef1f6;
  --muted:#8b93a1;
  --line:#232b38;

  --accent:#5b87f5;
  --accent2:#3f68d6;
  --accent-soft-bg:#1c2740;
  --accent-soft-border:#3a5490;
  --accent-soft-text:#9ab4ff;

  --good:#33b46f;
  --good-soft-bg:#0f2a1c;
  --good-soft-text:#5cd696;

  --warn:#e0a838;
  --warn-soft-bg:#332708;
  --warn-soft-text:#f0c66b;

  --bad:#e2707d;
  --bad-soft-bg:#341219;
  --bad-soft-text:#f2909c;
  --bad-soft-border:#5c2530;

  --shadow:0 8px 28px rgba(0,0,0,.45);

  color-scheme:dark;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{transition:background-color .2s ease,color .2s ease}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}

.app{
  min-height:100vh;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#101827;
  color:#fff;
  padding:14px 16px calc(12px + env(safe-area-inset-top));
  box-shadow:0 3px 18px rgba(0,0,0,.14);
}

.topin{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{font-weight:800;letter-spacing:.2px}
.brand small{display:block;font-weight:500;opacity:.68;font-size:11px;margin-top:2px}

.top-actions{display:flex;gap:7px}

.iconbtn{
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);
  color:#fff;
  border-radius:12px;
  padding:10px 12px;
  font-size:15px;
  line-height:1;
}

.main{max-width:1100px;margin:auto;padding:18px 14px}

.page{display:none}
.page.active{display:block;animation:fadein .18s ease}

@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.section-title h2{font-size:21px;margin:0}
.muted{color:var(--muted)}

.grid{display:grid;gap:12px}
.cards{grid-template-columns:repeat(4,1fr)}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
}

.metric .label{font-size:12px;color:var(--muted);font-weight:650}
.metric .value{font-size:24px;font-weight:800;margin-top:7px;line-height:1.1}
.metric .sub{font-size:11px;color:var(--muted);margin-top:7px}

.positive{color:var(--good)}
.negative{color:var(--bad)}
.warning{color:var(--warn)}

/* Hero-Kachel: Frei verfügbar */
.hero{
  background:linear-gradient(155deg,var(--accent),var(--accent2));
  color:#fff;
  border-radius:22px;
  padding:20px 20px 18px;
  box-shadow:0 14px 30px rgba(33,75,181,.28);
  margin-bottom:14px;
  position:relative;
  overflow:hidden;
}

.hero .herotop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-size:12.5px;
  font-weight:700;
  opacity:.85;
}

.hero .herodot{
  width:9px;height:9px;border-radius:50%;
  background:#b9c0c9;
  box-shadow:0 0 0 4px rgba(255,255,255,.15);
}

.hero .herodot.green{background:#4ee08a}
.hero .herodot.yellow{background:#f0c94a}
.hero .herodot.red{background:#f2828e}

.hero .heroval{
  font-size:37px;
  font-weight:800;
  margin-top:8px;
  letter-spacing:-.3px;
}

.hero .herosub{
  font-size:12.5px;
  opacity:.82;
  margin-top:6px;
}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}

.btn{
  border:0;border-radius:13px;padding:12px 14px;font-weight:750;
  background:var(--accent);color:#fff;
  transition:background .15s ease;
}
.btn:hover{background:var(--accent2)}
.btn.secondary{background:var(--accent-soft-bg);color:var(--accent-soft-text);border:1px solid var(--accent-soft-border)}
.btn.ghost{background:var(--bg-soft);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft-bg);color:var(--bad-soft-text);border:1px solid var(--bad-soft-border)}
.btn.small{padding:8px 10px;border-radius:10px;font-size:13px}
.btn:disabled{opacity:.5}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select,.toolbar input{width:auto}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:750;color:var(--muted)}

.field input,.field select,.field textarea,.inputlike{
  width:100%;border:1px solid var(--line);background:var(--card);
  border-radius:11px;padding:11px 12px;color:var(--ink);outline:none;
  font-size:16px;
}

.field input[type=color]{padding:4px;height:46px;cursor:pointer}

.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft-bg);
}

textarea{min-height:82px;resize:vertical}

.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.full{grid-column:1/-1}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 11px;font-size:12px}
.chip.on{background:var(--accent-soft-bg);border-color:var(--accent-soft-border);color:var(--accent-soft-text);font-weight:750}

.checkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.check{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:10px;border-radius:10px;background:var(--bg-soft);font-size:13px}
.check input{width:auto}

.list{display:flex;flex-direction:column;gap:8px}

.row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--card);
}

.swiperow{position:relative;overflow:hidden;border-radius:13px}
.swipe-del{
  position:absolute;top:0;right:0;bottom:0;width:84px;border:0;
  background:var(--bad);color:#fff;font-weight:750;font-size:12px;
  display:flex;align-items:center;justify-content:center;
}
.swiperow .row{
  position:relative;transition:transform .18s ease;touch-action:pan-y;cursor:pointer;
}

.undotoast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:#101827;color:#fff;
  padding:12px 8px 12px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);
  z-index:60;display:flex;align-items:center;gap:6px;font-size:13px;
  max-width:92vw;animation:fadein .18s ease;
}
.undotoast button{
  background:none;border:0;color:#8fb0ff;font-weight:750;padding:8px 10px;font-size:13px;
}

.row-main{min-width:0}
.row-title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:var(--muted);margin-top:3px}
.row-right{text-align:right;white-space:nowrap}
.amount{font-weight:800}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;background:#999}
.income .dot{background:var(--good)}
.expense .dot{background:var(--bad)}

.swatch{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid var(--line)}

.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:var(--bg-soft)}

.nav{
  position:fixed;z-index:30;left:0;right:0;bottom:0;
  background:color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:7px max(7px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(5,1fr);
}

.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:700;padding:7px 2px;border-radius:12px}
.nav button.active{color:var(--accent)}
.nav b{display:block;font-size:19px;line-height:19px;margin-bottom:2px}

.modalback{position:fixed;inset:0;background:rgba(8,15,28,.58);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modalback.show{display:flex}

.modal{
  width:min(760px,100%);max-height:94vh;overflow:auto;background:var(--card);
  border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 35px rgba(0,0,0,.25);
}

.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.modalhead h3{margin:0;font-size:19px;display:flex;align-items:center}
.close{border:1px solid var(--line);background:var(--bg-soft);color:var(--ink);border-radius:10px;padding:8px 11px}

.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px;flex-wrap:wrap}

.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:3px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;white-space:nowrap;font-size:12px;font-weight:700}
.tab.active{background:var(--accent-soft-bg);color:var(--accent-soft-text);border-color:var(--accent-soft-border)}

.calendar{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.calhead{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}
.week div{text-align:center;color:var(--muted);font-size:11px;font-weight:750;padding:9px 2px}

.day{min-height:68px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;background:var(--card);position:relative}
.day:nth-child(7n){border-right:0}
.day.mutedday{background:var(--bg-soft);color:var(--muted);opacity:.6}
.day.today{background:var(--accent-soft-bg)}
.daynum{font-size:12px;font-weight:750}
.marks{display:flex;gap:3px;margin-top:7px}
.mark{width:7px;height:7px;border-radius:50%}
.mark.i{background:var(--good)}
.mark.e{background:var(--bad)}
.mark.r{background:var(--accent)}
.daytotal{font-size:9px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden}

.chartbox{height:230px;position:relative}
.chartbox canvas{width:100%;height:100%}

.barrow{display:grid;grid-template-columns:minmax(90px,1fr) 2fr 70px;gap:8px;align-items:center;margin:9px 0}
.bar{height:10px;background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar span.over{background:var(--bad)}
.bar span.near{background:var(--warn)}
.barlabel{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barvalue{text-align:right;font-size:12px;font-weight:750}

.ampel{display:flex;align-items:center;gap:9px}
.light{width:15px;height:15px;border-radius:50%;background:#b9c0c9}
.light.green{background:var(--good)}
.light.yellow{background:var(--warn)}
.light.red{background:var(--bad)}

.note{font-size:11px;color:var(--muted);line-height:1.45;display:block}

.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.statline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.statline:last-child{border-bottom:0}

.successbox{padding:10px 12px;border-radius:11px;background:var(--good-soft-bg);color:var(--good-soft-text);font-size:12px}
.warningbox{padding:10px 12px;border-radius:11px;background:var(--warn-soft-bg);color:var(--warn-soft-text);font-size:12px}
.dangerbox{padding:10px 12px;border-radius:11px;background:var(--bad-soft-bg);color:var(--bad-soft-text);font-size:12px}

.modal .checkgrid{max-height:190px;overflow:auto}

.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--bg-soft);border:1px solid var(--line);font-size:10px;color:var(--muted);margin:2px 2px 0 0}

.goalrow{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.goalrow + .goalrow{margin-top:8px}
.goaltop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.goalname{font-weight:750}
.goalpct{font-size:12px;color:var(--muted);font-weight:700}

.themepicker{display:flex;gap:8px;flex-wrap:wrap}
.themepicker .chip{flex:1;text-align:center;min-width:90px}

.clickable{cursor:pointer}

.hidden{display:none!important}

@media(max-width:760px){
  .cards{grid-template-columns:1fr 1fr}
  .formgrid,.split{grid-template-columns:1fr}
  .barrow{grid-template-columns:90px 1fr 65px}
  .day{min-height:66px}
  .daynum{font-size:13px}
  .daytotal{display:none}
  .main{padding:15px 11px}
  .card{padding:14px}
  .metric .value{font-size:21px}
  .hero .heroval{font-size:32px}
}

@media(min-width:900px){
  .nav{
    position:sticky;top:0;bottom:auto;max-width:1100px;margin:auto;border:0;
    background:transparent;backdrop-filter:none;grid-template-columns:repeat(5,1fr);
    padding:0 14px 10px;
  }
  .nav button{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .app{padding-bottom:0}
  .modalback{align-items:center}
  .modal{border-radius:22px}
}
</style>

<script>
'use strict';

const KEY='finanzplan_v3';
const LEGACY_KEYS=['finanzplan_v2','finanzplan_v1'];

const defaultCats=[
  'Wohnen','Lebensmittel','Mobilität','Auto','Versicherung','Freizeit',
  'Gesundheit','Haushalt','Urlaub','Kleidung','Abos','Steuern','Gehalt','Sonstiges'
];

let state=loadState();
let pendingRecurringEdit=null;
let catChartInstance=null;
let trendChartInstance=null;
let reserveGoalChartInstance=null;

const UI_KEY='finanzplan_ui_v1';

function loadUiPrefs(){
  try{
    const raw=localStorage.getItem(UI_KEY);
    if(!raw) return {};
    const p=JSON.parse(raw);
    return {
      analysisPeriod: p.analysisPeriod || 'month',
      analysisType: p.analysisType || 'all',
      analysisFixed: !!p.analysisFixed,
      analysisCats: Array.isArray(p.analysisCats) ? p.analysisCats : []
    };
  }catch(e){ return {}; }
}

function saveUiPrefs(){
  try{
    localStorage.setItem(UI_KEY, JSON.stringify({
      analysisPeriod:ui.analysisPeriod,
      analysisType:ui.analysisType,
      analysisFixed:ui.analysisFixed,
      analysisCats:ui.analysisCats
    }));
  }catch(e){}
}

let ui=Object.assign({
  page:'dashboard',
  cal:new Date(),
  analysisPeriod:'month',
  analysisDate:new Date(),
  analysisCats:[],
  analysisType:'all',
  analysisFixed:false,
  calSelectedDay:null
}, loadUiPrefs());

/* =========================
   UNDO-TOAST
========================= */

let undoState=null;

function showUndoToast(message,undoFn){
  const existing=document.getElementById('undoToast');
  if(existing) existing.remove();
  if(undoState && undoState.timeoutId) clearTimeout(undoState.timeoutId);

  const toast=document.createElement('div');
  toast.id='undoToast';
  toast.className='undotoast';
  toast.innerHTML=`<span>${esc(message)}</span><button onclick="undoLastDelete()">Rückgängig</button>`;
  document.body.appendChild(toast);

  undoState={
    undo:undoFn,
    timeoutId:setTimeout(()=>{ toast.remove(); undoState=null; },6000)
  };
}

function undoLastDelete(){
  if(!undoState) return;
  clearTimeout(undoState.timeoutId);
  undoState.undo();
  const toast=document.getElementById('undoToast');
  if(toast) toast.remove();
  undoState=null;
  save();
  render();
}

/* =========================
   SWIPE-TO-DELETE (Buchungs- und Rücklagenzeilen)
========================= */

let swipeState=null;

function swipeStart(ev,el){
  const t=ev.touches[0];
  swipeState={el, startX:t.clientX, dx:0, moved:false};
}

function swipeMove(ev,el){
  if(!swipeState || swipeState.el!==el) return;
  const t=ev.touches[0];
  let dx=t.clientX-swipeState.startX;
  dx=Math.min(0,Math.max(dx,-84));
  swipeState.dx=dx;
  if(Math.abs(dx)>6) swipeState.moved=true;
  el.style.transform=`translateX(${dx}px)`;
}

function swipeEnd(ev,el){
  if(!swipeState || swipeState.el!==el) return;
  const open=swipeState.dx<-42;
  el.style.transform=open?'translateX(-84px)':'translateX(0)';
  if(swipeState.moved){
    el.dataset.justSwiped='1';
    setTimeout(()=>{ delete el.dataset.justSwiped; },300);
  }
  swipeState=null;
}

function swipeRowClick(ev,el,onTap){
  if(el.dataset.justSwiped) return;
  if(el.style.transform && el.style.transform.includes('-84')){
    el.style.transform='translateX(0)';
    return;
  }
  onTap();
}

/* =========================
   GRUNDLAGEN
========================= */

function id(){
  return (crypto && crypto.randomUUID) ? crypto.randomUUID()
    : Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function loadState(){
  try{
    let raw=localStorage.getItem(KEY);
    if(!raw){
      for(const lk of LEGACY_KEYS){
        const legacy=localStorage.getItem(lk);
        if(legacy){ raw=legacy; break; }
      }
    }
    const s=JSON.parse(raw);
    return normalize(s||{});
  }catch(e){
    return normalize({});
  }
}

function normalize(s){

  const cats = Array.isArray(s.categories) && s.categories.length
    ? s.categories.map(c=>{
        if(typeof c==='string') return {id:id(),name:c,budget:0,color:''};
        return {id:c.id||id(), name:c.name||'Kategorie', budget:Number(c.budget)||0, color:c.color||''};
      })
    : defaultCats.map(name=>({id:id(),name,budget:0,color:''}));

  const recurring = Array.isArray(s.recurring) ? s.recurring.map(r=>({
    id:r.id||id(),
    type:r.type||'expense',
    name:r.name||'Posten',
    amount:Number(r.amount)||0,
    amountHistory: Array.isArray(r.amountHistory) && r.amountHistory.length
      ? r.amountHistory.map(h=>({amount:Number(h.amount)||0, validFrom:h.validFrom||r.startDate||today()}))
      : [{amount:Number(r.amount)||0, validFrom:r.startDate||today()}],
    startDate:r.startDate||today(),
    recurrence:r.recurrence||'monthly',
    categories:Array.isArray(r.categories)?r.categories:[],
    notes:r.notes||'',
    fixed:!!r.fixed,
    active:r.active!==false,
    annualOccurrences:Number(r.annualOccurrences)||0
  })) : [];

  const goals = Array.isArray(s.goals) ? s.goals.map(g=>{
    let history = Array.isArray(g.history) ? g.history.map(h=>({
      id:h.id||id(), date:h.date||today(), amount:Number(h.amount)||0, kind:h.kind||'in', note:h.note||''
    })) : [];
    if(!history.length && Number(g.savedAmount)>0){
      history=[{id:id(), date:today(), amount:Number(g.savedAmount), kind:'in', note:'Migrierter Altbestand'}];
    }
    return {
      id:g.id||id(),
      name:g.name||'Sparziel',
      targetAmount:Number(g.targetAmount)||0,
      targetDate:g.targetDate||'',
      notes:g.notes||'',
      history
    };
  }) : [];

  const favorites = Array.isArray(s.favorites) ? s.favorites.map(f=>({
    id:f.id||id(), type:f.type||'expense', amount:Number(f.amount)||0,
    name:f.name||'Favorit', categories:Array.isArray(f.categories)?f.categories:[]
  })) : [];

  const reserves = Array.isArray(s.reserves) ? s.reserves.map(r=>({
    id:r.id||id(), name:r.name||'Rücklage', notes:r.notes||''
  })) : [];

  const reserveEntries = Array.isArray(s.reserveEntries) ? s.reserveEntries.map(e=>({
    id:e.id||id(), reserveId:e.reserveId, date:e.date||today(),
    amount:Number(e.amount)||0, kind:e.kind||'in', note:e.note||''
  })) : [];

  return {
    version:3,

    settings:Object.assign(
      {
        currency:'EUR',
        openingBalance:0,
        theme:'system',
        ampel:{
          balance:{green:1000,yellow:0},
          available:{green:1000,yellow:0},
          monthExpense:{green:1000,yellow:2000}
        }
      },
      s.settings||{},
      {
        ampel:Object.assign(
          {
            balance:{green:1000,yellow:0},
            available:{green:1000,yellow:0},
            monthExpense:{green:1000,yellow:2000}
          },
          s.settings && s.settings.ampel
            ? {
                balance:s.settings.ampel.balance||{green:1000,yellow:0},
                available:s.settings.ampel.available||s.settings.ampel.adjusted||{green:1000,yellow:0},
                monthExpense:s.settings.ampel.monthExpense||{green:1000,yellow:2000}
              }
            : {}
        )
      }
    ),

    categories:cats,
    transactions:Array.isArray(s.transactions) ? s.transactions : [],
    recurring,
    favorites,
    goals,
    reserves,
    reserveEntries
  };
}

function esc(x){
  return String(x??'').replace(/[&<>'"]/g, m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
  }[m]));
}

function money(n){
  return new Intl.NumberFormat('de-DE',{style:'currency',currency:state.settings.currency||'EUR'}).format(Number(n)||0);
}

function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function dateObj(s){
  if(s instanceof Date) return new Date(s.getFullYear(),s.getMonth(),s.getDate());
  const [y,m,d]=String(s).split('-').map(Number);
  return new Date(y,m-1,d);
}

function iso(d){
  d=dateObj(d);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function today(){ return iso(new Date()); }

function addDays(s,n){ const d=dateObj(s); d.setDate(d.getDate()+n); return iso(d); }

function endMonth(s){ const d=dateObj(s); return iso(new Date(d.getFullYear(),d.getMonth()+1,0)); }
function startMonth(s){ const d=dateObj(s); return iso(new Date(d.getFullYear(),d.getMonth(),1)); }

function addMonths(s,n){
  const d=dateObj(s);
  const day=d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth()+n);
  d.setDate(Math.min(day, new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));
  return iso(d);
}

function fmtDate(s){ return new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(dateObj(s)); }
function fmtMonth(s){ return new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(dateObj(s)); }
function fmtMonthShort(s){ return new Intl.DateTimeFormat('de-DE',{month:'short'}).format(dateObj(s)); }
function monthName(s){ return new Intl.DateTimeFormat('de-DE',{month:'long'}).format(dateObj(s)); }

function sum(arr,fn){ return arr.reduce((a,x)=>a+(fn?fn(x):Number(x)||0),0); }

function catName(cid){
  return (state.categories.find(c=>c.id===cid)?.name) || 'Gelöschte Kategorie';
}

function catBudget(cid){
  return Number(state.categories.find(c=>c.id===cid)?.budget)||0;
}

function catColorOf(cid){
  const idx=state.categories.findIndex(x=>x.id===cid);
  if(idx<0) return '#999999';
  const c=state.categories[idx];
  return (c.color && c.color.trim()) ? c.color : autoColorFor(idx);
}

const colorPalette=['#356ae6','#18864b','#bd7b00','#c43d4b','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#4f46e5','#0d9488','#b91c1c'];
function autoColorFor(idx){
  return colorPalette[((idx%colorPalette.length)+colorPalette.length)%colorPalette.length];
}

function catsHtml(ids){
  return (ids||[]).map(cid=>{
    const col=catColorOf(cid);
    const dot=`<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${esc(col)};margin-right:4px;vertical-align:middle"></span>`;
    return `<span class="pill">${dot}${esc(catName(cid))}</span>`;
  }).join('') || '<span class="pill">ohne Kategorie</span>';
}

/* =========================
   FINANZBERECHNUNG
========================= */

function actualBalance(){
  const t=today();
  return (Number(state.settings.openingBalance)||0) + sum(
    state.transactions.filter(x=>x.date<=t),
    x=>x.type==='income' ? Number(x.amount) : -Number(x.amount)
  );
}

function transBetween(a,b){
  return state.transactions.filter(x=>x.date>=a && x.date<=b);
}

/* =========================
   WIEDERKEHRENDE POSTEN (mit Betragshistorie)
========================= */

function amountAt(tpl,date){
  const hist = (tpl.amountHistory && tpl.amountHistory.length)
    ? [...tpl.amountHistory].sort((a,b)=>a.validFrom.localeCompare(b.validFrom))
    : [{amount:tpl.amount, validFrom:tpl.startDate}];

  let cur=hist[0].amount;
  for(const h of hist){
    if(h.validFrom<=date) cur=h.amount; else break;
  }
  return cur;
}

function occurrenceDates(tpl,a,b){
  const out=[];
  let cur=dateObj(tpl.startDate);
  const end=dateObj(b);
  const from=dateObj(a);

  if(tpl.recurrence==='manual') return out;

  if(cur<from){
    if(tpl.recurrence==='daily'){
      cur=new Date(from);
    }else if(tpl.recurrence==='weekly'){
      const diff=Math.floor((from-cur)/86400000);
      cur.setDate(cur.getDate()+Math.ceil(diff/7)*7);
    }else if(tpl.recurrence==='monthly' || tpl.recurrence==='quarterly'){
      let months=(from.getFullYear()-cur.getFullYear())*12+from.getMonth()-cur.getMonth();
      const step=tpl.recurrence==='quarterly'?3:1;
      months=Math.floor(months/step)*step;
      cur=dateObj(addMonths(tpl.startDate,months));
      while(cur<from){ cur=dateObj(addMonths(iso(cur),step)); }
    }else if(tpl.recurrence==='yearly'){
      let years=from.getFullYear()-cur.getFullYear();
      cur=dateObj(`${cur.getFullYear()+Math.max(0,years)}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`);
      if(cur<from){
        cur=dateObj(`${cur.getFullYear()+1}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`);
      }
    }
  }

  let guard=0;
  while(cur<=end && guard++<5000){
    if(cur>=from) out.push(iso(cur));

    if(tpl.recurrence==='daily'){ cur.setDate(cur.getDate()+1); }
    else if(tpl.recurrence==='weekly'){ cur.setDate(cur.getDate()+7); }
    else if(tpl.recurrence==='monthly'){ cur=dateObj(addMonths(iso(cur),1)); }
    else if(tpl.recurrence==='quarterly'){ cur=dateObj(addMonths(iso(cur),3)); }
    else if(tpl.recurrence==='yearly'){
      const m=cur.getMonth()+1, d=cur.getDate();
      cur=new Date(cur.getFullYear()+1,m-1,d);
    }else{ break; }
  }

  return out;
}

function virtualOccurrences(a,b){
  const rows=[];
  for(const r of state.recurring.filter(x=>x.active!==false && x.recurrence!=='manual')){
    for(const d of occurrenceDates(r,a,b)){
      const actual=state.transactions.some(t=>t.recurringTemplateId===r.id && t.date===d);
      if(!actual){
        rows.push({
          id:'v_'+r.id+'_'+d, date:d, type:r.type, amount:amountAt(r,d),
          description:r.name, notes:r.notes||'', categories:r.categories||[],
          recurringTemplateId:r.id, virtual:true, fixed:r.fixed
        });
      }
    }
  }
  return rows;
}

function expectedRows(a,b,type){
  const planned=state.transactions.filter(t=>t.date>=a && t.date<=b && (type?t.type===type:true));
  const virtual=virtualOccurrences(a,b).filter(t=>type?t.type===type:true);
  return planned.concat(virtual);
}

function monthlyEquivalent(r){
  const a=amountAt(r, today());
  switch(r.recurrence){
    case'daily': return a*365/12;
    case'weekly': return a*52/12;
    case'monthly': return a;
    case'quarterly': return a/3;
    case'yearly': return a/12;
    case'manual': return a*(Number(r.annualOccurrences)||0)/12;
    default: return 0;
  }
}

function recurringLabel(r){
  return ({
    daily:'täglich',weekly:'wöchentlich',monthly:'monatlich',
    quarterly:'vierteljährlich',yearly:'jährlich',manual:'unregelmäßig / manuell'
  })[r.recurrence]||'einmalig';
}

/* =========================
   SPARZIELE & RÜCKLAGEN
========================= */

function goalTotal(g){
  return sum(g.history, h=>h.kind==='in' ? h.amount : -h.amount);
}

function goalsGrandTotal(){
  return sum(state.goals, goalTotal);
}

function reserveTotal(rid){
  return sum(state.reserveEntries.filter(e=>e.reserveId===rid), e=>e.kind==='in' ? e.amount : -e.amount);
}

function reservesGrandTotal(){
  return sum(state.reserves, r=>reserveTotal(r.id));
}

function reservesTotalAt(date){
  return sum(state.reserveEntries.filter(e=>e.date<=date), e=>e.kind==='in'?e.amount:-e.amount);
}

function goalsTotalAt(date){
  return sum(state.goals.flatMap(g=>g.history), h=>h.date<=date ? (h.kind==='in'?h.amount:-h.amount) : 0);
}

/* Kernkennzahl: Frei verfügbar bis Monatsende */
function freiVerfuegbar(){
  const t=today();
  const mEnd=endMonth(t);
  return actualBalance()
    + sum(expectedRows(addDays(t,1),mEnd,'income'), x=>x.amount)
    - sum(expectedRows(addDays(t,1),mEnd,'expense'), x=>x.amount)
    - reservesGrandTotal()
    - goalsGrandTotal();
}

function light(value,th){
  if(value>=Number(th.green)) return 'green';
  if(value>=Number(th.yellow)) return 'yellow';
  return 'red';
}

function ampelHtml(label,value,th){
  return `
    <div class="statline">
      <span class="ampel">
        <span class="light ${light(value,th)}"></span>
        ${esc(label)}
      </span>
      <span><strong>${money(value)}</strong></span>
    </div>
  `;
}

function budgetBarHtml(c,spent){
  const pct = c.budget>0 ? spent/c.budget*100 : 0;
  const cls = pct>=100 ? 'over' : pct>=90 ? 'near' : '';
  const style = cls ? `width:${Math.min(100,pct)}%` : `width:${Math.min(100,pct)}%;background:${esc(catColorOf(c.id))}`;
  return `
    <div class="barrow">
      <div class="barlabel">${esc(c.name)}</div>
      <div class="bar"><span class="${cls}" style="${style}"></span></div>
      <div class="barvalue">${money(spent)} / ${money(c.budget)}</div>
    </div>
  `;
}

function spentThisMonthForCat(cid){
  const ms=startMonth(today()), me=endMonth(today());
  return sum(transBetween(ms,me).filter(x=>x.type==='expense' && (x.categories||[]).includes(cid)), x=>x.amount);
}

function upcomingAmountChangesHtml(){
  const t=today();
  const rows=[];

  for(const r of state.recurring){
    const hist=(r.amountHistory||[]).slice().sort((a,b)=>a.validFrom.localeCompare(b.validFrom));
    const future=hist.find(h=>h.validFrom>t);
    if(future){
      rows.push({ name:r.name, from:amountAt(r,t), to:future.amount, date:future.validFrom });
    }
  }

  if(!rows.length) return '';

  rows.sort((a,b)=>a.date.localeCompare(b.date));

  return `
    <div class="card" style="margin-bottom:12px">
      <div class="section-title"><h2>Anstehende Änderungen</h2></div>
      ${rows.map(x=>`
        <div class="statline">
          <span>${esc(x.name)} · ab ${esc(fmtDate(x.date))}</span>
          <strong>${money(x.from)} → ${money(x.to)}</strong>
        </div>
      `).join('')}
    </div>
  `;
}

function budgetWarningsHtml(ms,t){
  const budgeted=state.categories.filter(c=>c.budget>0);
  if(!budgeted.length) return '';

  const spentMap={};
  for(const x of transBetween(ms,t).filter(x=>x.type==='expense')){
    for(const c of x.categories||[]) spentMap[c]=(spentMap[c]||0)+Number(x.amount);
  }

  const rows=budgeted
    .map(c=>({cat:c, spent:spentMap[c.id]||0, pct:c.budget>0?(spentMap[c.id]||0)/c.budget*100:0}))
    .filter(r=>r.pct>=70)
    .sort((a,b)=>b.pct-a.pct);

  if(!rows.length) return '';

  return `
    <div class="card" style="margin-bottom:12px">
      <div class="section-title"><h2>Budget-Hinweise</h2></div>
      ${rows.map(r=>budgetBarHtml(r.cat,r.spent)).join('')}
    </div>
  `;
}

function goalsWidgetHtml(){
  if(!state.goals.length) return '';

  return `
    <div class="card" style="margin-bottom:12px">
      <div class="section-title">
        <h2>Sparziele</h2>
        <button class="btn small secondary" onclick="showPage('lists')">Verwalten</button>
      </div>
      ${state.goals.slice(0,4).map(goalRowHtml).join('')}
    </div>
  `;
}

function goalRowHtml(g){
  const total=goalTotal(g);
  const pct = g.targetAmount>0 ? Math.min(100, total/g.targetAmount*100) : 0;
  return `
    <div class="goalrow">
      <div class="goaltop">
        <span class="goalname">${esc(g.name)}</span>

function renderCalendar(){
  const el=document.getElementById('page-calendar');
  const base=ui.cal;
  const first=new Date(base.getFullYear(),base.getMonth(),1);
  const last=new Date(base.getFullYear(),base.getMonth()+1,0);
  const start=(first.getDay()+6)%7;
  const end=last.getDate();
  const cells=[];

  for(let i=0;i<start;i++){
    const d=new Date(first); d.setDate(d.getDate()-start+i);
    cells.push(dayCell(d,true));
  }
  for(let d=1;d<=end;d++){
    cells.push(dayCell(new Date(base.getFullYear(),base.getMonth(),d),false));
  }
  while(cells.length<42){
    const d=new Date(last); d.setDate(d.getDate()+cells.length-(start+end)+1);
    cells.push(dayCell(d,true));
  }

  el.innerHTML=`
    <div class="section-title">
      <div>
        <h2>Kalender</h2>
        <div class="muted">Buchungen nach Datum</div>
      </div>
      <button class="btn small" onclick="openTransaction('expense',null,today())">＋ heute</button>
    </div>

    <div class="calendar">
      <div class="calhead">
        <button class="btn small secondary" onclick="changeCal(-1)">‹</button>
        <strong>${esc(fmtMonth(first))}</strong>
        <div class="toolbar">
          <button class="btn small secondary" onclick="goCalToday()">Heute</button>
          <button class="btn small secondary" onclick="changeCal(1)">›</button>
        </div>
      </div>
      <div class="week">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div>${x}</div>`).join('')}</div>
      <div class="days">${cells.join('')}</div>
    </div>

    <div class="toolbar" style="margin-top:10px;justify-content:center;gap:16px">
      <span class="row-sub"><span class="dot" style="background:var(--good)"></span>Einnahme</span>
      <span class="row-sub"><span class="dot" style="background:var(--bad)"></span>Ausgabe</span>
      <span class="row-sub"><span class="dot" style="background:var(--accent)"></span>Rücklage</span>
    </div>

    <div id="dayDetail" style="margin-top:12px"></div>
  `;

  if(ui.calSelectedDay) dayDetail(ui.calSelectedDay);
}

function dayCell(d,muted){
  const s=iso(d);
  const ts=state.transactions.filter(x=>x.date===s);
  const rs=state.reserveEntries.filter(x=>x.date===s);
  const inc=sum(ts.filter(x=>x.type==='income'),x=>x.amount);
  const exp=sum(ts.filter(x=>x.type==='expense'),x=>x.amount);

  return `
    <button class="day ${muted?'mutedday':''} ${s===today()?'today':''}" onclick="dayDetail('${s}')">
      <div class="daynum">${d.getDate()}</div>
      <div class="marks">
        ${inc?'<span class="mark i"></span>':''}
        ${exp?'<span class="mark e"></span>':''}
        ${rs.length?'<span class="mark r"></span>':''}
      </div>
      <div class="daytotal">

function periodRange(){
  const d=dateObj(ui.analysisDate);

  if(ui.analysisPeriod==='year'){
    return [`${d.getFullYear()}-01-01`, `${d.getFullYear()}-12-31`];
  }
  if(ui.analysisPeriod==='quarter'){
    const q=Math.floor(d.getMonth()/3);
    const m=q*3;
    return [iso(new Date(d.getFullYear(),m,1)), iso(new Date(d.getFullYear(),m+3,0))];
  }
  if(ui.analysisPeriod==='rolling365'){
    return [addDays(today(),-364), today()];
  }
  if(ui.analysisPeriod==='all'){
    return [earliestDataDate(), today()];
  }
  return [startMonth(d), endMonth(d)];
}

function earliestDataDate(){
  if(!state.transactions.length) return today();
  return state.transactions.reduce((a,x)=> x.date<a ? x.date : a, state.transactions[0].date);
}

function comparisonRange(){
  if(ui.analysisPeriod==='all') return null;
  const [a]=periodRange();

  if(ui.analysisPeriod==='month'){
    const pa=addMonths(a,-1);
    return [pa, endMonth(pa)];
  }
  if(ui.analysisPeriod==='quarter'){
    const pa=addMonths(a,-3);
    return [pa, addDays(a,-1)];
  }
  if(ui.analysisPeriod==='year'){
    const y=Number(a.slice(0,4))-1;
    return [`${y}-01-01`, `${y}-12-31`];
  }
  if(ui.analysisPeriod==='rolling365'){
    const pb=addDays(a,-1);
    return [addDays(pb,-364), pb];
  }
  return null;
}

function deltaBadge(current,previous,goodWhenUp){
  if(previous===0 && current===0) return '';
  const diff=current-previous;
  const pct = previous!==0 ? (diff/Math.abs(previous)*100) : 100;
  const up=diff>0;
  const good = diff===0 ? null : (goodWhenUp ? up : !up);
  const color = good===null ? 'var(--muted)' : (good?'var(--good)':'var(--bad)');
  const sign = diff>0?'+':'';
  return `<div class="sub" style="color:${color}">vs. Vorperiode: ${sign}${money(diff)} (${sign}${pct.toFixed(0)}%)</div>`;
}

function splitExpenseTotals(rows){
  const map={};
  for(const x of rows.filter(x=>x.type==='expense')){
    const cats=(x.categories && x.categories.length) ? x.categories : ['__none__'];
    const share=x.amount/cats.length;
    for(const c of cats) map[c]=(map[c]||0)+share;
  }
  return map;
}

function splitCatLabel(cid){
  return cid==='__none__' ? 'Ohne Kategorie' : catName(cid);
}

function renderCatChart(entries,total){
  const c=document.getElementById('catChart');
  if(!c) return;
  if(catChartInstance){ catChartInstance.destroy(); catChartInstance=null; }
  if(!entries.length || typeof Chart==='undefined') return;

  const labels=entries.map(([cid])=>splitCatLabel(cid));
  const values=entries.map(([,v])=>v);
  const colors=entries.map(([cid])=> cid==='__none__' ? '#999999' : catColorOf(cid));

  catChartInstance=new Chart(c.getContext('2d'), {
    type:'pie',
    data:{ labels, datasets:[{ data:values, backgroundColor:colors, borderWidth:0 }] },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{ position:'bottom', labels:{ color:cssVar('--ink'), boxWidth:10, font:{size:11} } },

function renderTrendChart(){
  const c=document.getElementById('trendChart');
  if(!c || typeof Chart==='undefined') return;
  if(trendChartInstance){ trendChartInstance.destroy(); trendChartInstance=null; }

  const months=[];
  for(let i=5;i>=0;i--) months.push(addMonths(startMonth(today()),-i));

  const labels=months.map(m=>fmtMonthShort(m));
  const inc=months.map(m=>sum(transBetween(startMonth(m),endMonth(m)).filter(x=>x.type==='income'),x=>x.amount));
  const exp=months.map(m=>sum(transBetween(startMonth(m),endMonth(m)).filter(x=>x.type==='expense'),x=>x.amount));

  trendChartInstance=new Chart(c.getContext('2d'), {
    type:'bar',
    data:{
      labels,
      datasets:[
        { label:'Einnahmen', data:inc, backgroundColor:cssVar('--good'), borderRadius:5, maxBarThickness:22 },
        { label:'Ausgaben', data:exp, backgroundColor:cssVar('--bad'), borderRadius:5, maxBarThickness:22 }

    options:{
      responsive:true,
      maintainAspectRatio:false,

      plugins:{ legend:{ position:'bottom', labels:{ color:cssVar('--ink'), boxWidth:10, font:{size:11} } } }
    }
  });
}

function renderReserveGoalChart(){

function periodLabel(){
  const d=dateObj(ui.analysisDate);
  if(ui.analysisPeriod==='year') return 'Kalenderjahr '+d.getFullYear();
  if(ui.analysisPeriod==='quarter') return `Q${Math.floor(d.getMonth()/3)+1} ${d.getFullYear()}`;
  if(ui.analysisPeriod==='rolling365') return 'Letzte 365 Tage';
  if(ui.analysisPeriod==='all') return 'Gesamtzeitraum';
  return fmtMonth(d);
}

function setAnalysisPeriod(p){ ui.analysisPeriod=p; renderAnalysis(); }

function analysisShift(n){
  if(ui.analysisPeriod==='year'){
    ui.analysisDate=new Date(ui.analysisDate.getFullYear()+n, ui.analysisDate.getMonth(),1);
  }else if(ui.analysisPeriod==='quarter'){
    ui.analysisDate=new Date(ui.analysisDate.getFullYear(), ui.analysisDate.getMonth()+3*n,1);
  }else{
    ui.analysisDate=new Date(ui.analysisDate.getFullYear(), ui.analysisDate.getMonth()+n,1);
  }
  renderAnalysis();
}

function isoMonthValue(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function jumpToMonth(v){
  if(!v) return;
  const [y,m]=v.split('-').map(Number);
  ui.analysisDate=new Date(y,m-1,1);
  renderAnalysis();
}

function jumpToYear(v){
  const y=Number(v);
  if(!y) return;
  ui.analysisDate=new Date(y, ui.analysisDate.getMonth(),1);
  renderAnalysis();
}

function toggleAnalysisCat(c){
  ui.analysisCats=ui.analysisCats.includes(c) ? ui.analysisCats.filter(x=>x!==c) : ui.analysisCats.concat(c);
  renderAnalysis();
}

function applyTemplate(rid){
  if(!rid) return;
  const r=state.recurring.find(x=>x.id===rid);
  if(!r) return;

  const f=document.getElementById('txForm');
  f.amount.value=amountAt(r,today());
  f.description.value=r.name;
  f.notes.value=r.notes||'';
  f.type.value=r.type;

  f.querySelectorAll('input[name="cat"]').forEach(c=>{
    c.checked=(r.categories||[]).includes(c.value);
  });

  if(f.recurrence){
    f.recurrence.value=r.recurrence==='manual' ? 'once' : r.recurrence;
  }
}

function applyFavoriteToForm(fav){
  const f=document.getElementById('txForm');
  if(!f) return;
  f.amount.value=fav.amount;
  f.description.value=fav.name;
  f.type.value=fav.type;
  f.querySelectorAll('input[name="cat"]').forEach(c=>{
    c.checked=(fav.categories||[]).includes(c.value);
  });
}

function saveTransaction(ev,type,tid){
  ev.preventDefault();
  const f=ev.target;
  const fd=new FormData(f);
  const r=fd.get('recurrence');

  const obj={
    id:tid||id(),
    type:fd.get('type'),
    amount:Math.round(Number(fd.get('amount'))*100)/100,
    date:fd.get('date'),
    description:String(fd.get('description')).trim(),
    notes:String(fd.get('notes')||'').trim(),
    categories:fd.getAll('cat'),
    recurrence:r,
    recurringTemplateId:fd.get('template')||null,
    createdAt:new Date().toISOString()
  };

  if(!obj.amount || obj.amount<0 || !obj.date || !obj.description){
    alert('Bitte Betrag, Datum und Bezeichnung prüfen.');
    return false;
  }

  if(tid){
    const i=state.transactions.findIndex(x=>x.id===tid);
    if(i>=0) state.transactions[i]=Object.assign({}, state.transactions[i], obj);
  }else{
    state.transactions.push(obj);
  }

  if(r!=='once'){
    const existing=obj.recurringTemplateId ? state.recurring.find(x=>x.id===obj.recurringTemplateId) : null;

    if(existing){
      Object.assign(existing, {
        type:obj.type, name:obj.description, categories:obj.categories, notes:obj.notes
      });
      if(Math.round(amountAt(existing,today())*100)!==Math.round(obj.amount*100)){
        existing.amountHistory=[...(existing.amountHistory||[]), {amount:obj.amount, validFrom:obj.date}]
          .sort((a,b)=>a.validFrom.localeCompare(b.validFrom));
        existing.amount=obj.amount;
      }
    }else{
      const tpl={
        id:id(), type:obj.type, name:obj.description, amount:obj.amount,
        amountHistory:[{amount:obj.amount, validFrom:obj.date}],
        startDate:obj.date, recurrence:r, categories:obj.categories, notes:obj.notes,
        fixed:false, active:true, annualOccurrences:0
      };
      state.recurring.push(tpl);
      obj.recurringTemplateId=tpl.id;
    }

    const savedTx=state.transactions.find(x=>x.id===obj.id);
    if(savedTx) savedTx.recurringTemplateId=obj.recurringTemplateId;
  }

  save();
  closeModal();
  render();
  return false;
}

function deleteTransaction(tid){
  const idx=state.transactions.findIndex(x=>x.id===tid);
  if(idx<0) return;
  const removed=state.transactions[idx];
  state.transactions.splice(idx,1);
  save();
  render();
  showUndoToast('Buchung gelöscht.', ()=>{ state.transactions.splice(idx,0,removed); });
}

  ev.preventDefault();
  const fd=new FormData(ev.target);
  const name=String(fd.get('name')).trim();
  const budget=Number(fd.get('budget'))||0;
  const color=String(fd.get('color')||'');

  if(!name){ alert('Bitte einen Namen angeben.'); return false; }

  if(cid){
    const c=state.categories.find(x=>x.id===cid);
    if(c){ c.name=name; c.budget=budget; c.color=color; }
  }else{
    if(state.categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){
      alert('Diese Kategorie gibt es bereits.');
      return false;
    }
    state.categories.push({id:id(), name, budget, color});
  }

  save();
  closeModal();
  render();
  return false;
}

function deleteCategory(cid){
  if(state.categories.length<=1){
    alert('Mindestens eine Kategorie muss bestehen bleiben.');
    return;
  }
  const c=state.categories.find(x=>x.id===cid);
  if(!c) return;

  if(!confirm(`Kategorie „${c.name}" löschen? Sie wird auch aus vorhandenen Buchungen, Vorlagen und Favoriten entfernt.`)) return;

  state.categories=state.categories.filter(x=>x.id!==cid);
  state.transactions.forEach(t=>{ t.categories=(t.categories||[]).filter(x=>x!==cid); });
  state.recurring.forEach(r=>{ r.categories=(r.categories||[]).filter(x=>x!==cid); });
  state.favorites.forEach(f=>{ f.categories=(f.categories||[]).filter(x=>x!==cid); });

  save();
  render();
}

function saveRecurring(ev,rid){
  ev.preventDefault();
  const fd=new FormData(ev.target);

  const obj={
    id:rid||id(),
    type:fd.get('type'),
    amount:Math.round(Number(fd.get('amount'))*100)/100,
    name:String(fd.get('name')).trim(),
    startDate:fd.get('startDate'),
    recurrence:fd.get('recurrence'),
    annualOccurrences:Number(fd.get('annualOccurrences'))||0,
    categories:fd.getAll('cat'),
    notes:String(fd.get('notes')||'').trim(),
    fixed:fd.has('fixed'),
    active:true
  };

  if(!obj.amount || !obj.name || !obj.startDate){
    alert('Bitte Betrag, Bezeichnung und Startdatum prüfen.');
    return false;
  }

  const existing = rid ? state.recurring.find(x=>x.id===rid) : null;

  if(existing && Math.round(amountAt(existing,today())*100)!==Math.round(obj.amount*100)){
    pendingRecurringEdit={rid, obj};
    openRecurringEffectiveDate(existing, obj.amount);
    return false;
  }

  finalizeRecurringSave(obj, rid, null);
  return false;
}

function openRecurringEffectiveDate(existing,newAmount){
  document.getElementById('modal').innerHTML=`
    <div class="modalhead">
      <h3>Ab wann gilt der neue Betrag?</h3>
      <button class="close" onclick="editRecurring('${existing.id}')">✕</button>
    </div>
    <p class="note">„${esc(existing.name)}" ändert sich von ${money(amountAt(existing,today()))} auf ${money(newAmount)}. Bis zu diesem Datum gilt weiterhin der bisherige Betrag, danach automatisch der neue.</p>
    <div class="field">
      <label>Neuer Betrag gültig ab</label>
      <input id="effDate" type="date" value="${esc(today())}">
    </div>
    <div class="actions">
      <button type="button" class="btn secondary" onclick="editRecurring('${existing.id}')">Abbrechen</button>
      <button class="btn" onclick="confirmRecurringEffectiveDate()">Übernehmen</button>
    </div>
  `;
  showModal();
}

function confirmRecurringEffectiveDate(){
  if(!pendingRecurringEdit) return;
  const effDate=document.getElementById('effDate').value;
  if(!effDate){ alert('Bitte ein Datum wählen.'); return; }

  finalizeRecurringSave(pendingRecurringEdit.obj, pendingRecurringEdit.rid, effDate);
  pendingRecurringEdit=null;
}

function finalizeRecurringSave(obj,rid,effectiveDate){
  const existing = rid ? state.recurring.find(x=>x.id===rid) : null;
  let history;

  if(existing){
    history = (existing.amountHistory && existing.amountHistory.length)
      ? [...existing.amountHistory]
      : [{amount:existing.amount, validFrom:existing.startDate}];

    if(effectiveDate){
      history = history.filter(h=>h.validFrom < effectiveDate);
      history.push({amount:obj.amount, validFrom:effectiveDate});
      history.sort((a,b)=>a.validFrom.localeCompare(b.validFrom));
    }
  }else{
    history=[{amount:obj.amount, validFrom:obj.startDate}];
  }

  obj.amountHistory=history;

  if(existing){
    Object.assign(existing, obj);
  }else{
    state.recurring.push(obj);
  }

  save();
  openRecurring();
}

function deleteRecurring(rid){
  if(!confirm('Diesen wiederkehrenden Posten löschen? Bereits gespeicherte Buchungen bleiben erhalten.')) return;

  state.recurring=state.recurring.filter(x=>x.id!==rid);
  state.transactions.forEach(t=>{ if(t.recurringTemplateId===rid) t.recurringTemplateId=null; });

  save();
  openRecurring();
}

/* =========================

========================= */

      <button type="button" class="chip ${state.settings.theme==='dark'?'on':''}" onclick="setTheme('dark'); openSettings()">☾ Dunkel</button>
      <button type="button" class="chip ${state.settings.theme==='system'?'on':''}" onclick="setTheme('system'); openSettings()">◐ System</button>
    </div>

    <div class="formgrid">
      <div class="field">
        <label>Start-/Eröffnungsbestand</label>
        <input id="setOpening" type="number" step="0.01" value="${esc(state.settings.openingBalance)}">
      </div>
      <div class="field">
        <label>Währung</label>
        <select id="setCurrency">
          <option value="EUR" ${state.settings.currency==='EUR'?'selected':''}>Euro (€)</option>
          <option value="CHF" ${state.settings.currency==='CHF'?'selected':''}>Schweizer Franken (CHF)</option>

    <div class="formgrid">
      <div class="field"><label>IST-Stand – Grün ab</label><input id="bG" type="number" value="${esc(state.settings.ampel.balance.green)}"></div>
      <div class="field"><label>IST-Stand – Gelb ab</label><input id="bY" type="number" value="${esc(state.settings.ampel.balance.yellow)}"></div>
      <div class="field"><label>Frei verfügbar – Grün ab</label><input id="aG" type="number" value="${esc(state.settings.ampel.available.green)}"></div>
      <div class="field"><label>Frei verfügbar – Gelb ab</label><input id="aY" type="number" value="${esc(state.settings.ampel.available.yellow)}"></div>
      <div class="field"><label>Ausgaben – Grün bis</label><input id="eG" type="number" value="${esc(state.settings.ampel.monthExpense.green)}"></div>
      <div class="field"><label>Ausgaben – Gelb bis</label><input id="eY" type="number" value="${esc(state.settings.ampel.monthExpense.yellow)}"></div>
    </div>

function saveSettings(){
  state.settings.openingBalance=Number(document.getElementById('setOpening').value)||0;
  state.settings.currency=document.getElementById('setCurrency').value;

  state.settings.ampel.balance={
    green:Number(document.getElementById('bG').value)||0,
    yellow:Number(document.getElementById('bY').value)||0
  };
  state.settings.ampel.available={
    green:Number(document.getElementById('aG').value)||0,
    yellow:Number(document.getElementById('aY').value)||0
  };
  state.settings.ampel.monthExpense={
    green:Number(document.getElementById('eG').value)||0,
    yellow:Number(document.getElementById('eY').value)||0
  };

  save();
  closeModal();
  render();
}

/* =========================
   DATENTRANSFER
========================= */

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`FinanzPlan-Sicherung-${today()}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

document.getElementById('importFile').addEventListener('change', e=>{
  const f=e.target.files[0];
  if(!f) return;

  const r=new FileReader();
  r.onload=()=>{
    try{
      const imported=JSON.parse(r.result);
      if(!imported || !Array.isArray(imported.transactions) || !Array.isArray(imported.categories) || !Array.isArray(imported.recurring)){
        throw Error();
      }
      if(!confirm('Import ersetzt den aktuellen Datenbestand. Fortfahren?')) return;

      state=normalize(imported);
      save();
      render();
      alert('Daten erfolgreich importiert.');
    }catch(err){
      alert('Die Datei ist keine gültige FinanzPlan-Sicherung.');
    }
  };
  r.readAsText(f);
  e.target.value='';
});

function resetData(){
  if(!confirm('Wirklich ALLE Daten löschen? Dieser Schritt kann nur mit einer vorherigen Sicherung rückgängig gemacht werden.')) return;
  if(!confirm('Letzte Sicherheitsabfrage: Daten endgültig löschen?')) return;

  localStorage.removeItem(KEY);
  state=normalize({});
  closeModal();
  render();
}

/* =========================
   MODAL
========================= */

function showModal(){
  document.getElementById('modalBack').classList.add('show');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modalBack').classList.remove('show');
  document.body.style.overflow='';
}

function backdropClose(e){
  if(e.target.id==='modalBack') closeModal();
}

window.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
});

/* =========================
   START
========================= */

applyTheme();
render();

</script>
