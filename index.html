<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>FinanzPlan – persönlicher Finanzmanager</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#fff;
  --ink:#152033;
  --muted:#6b7482;
  --line:#e4e8ee;
  --accent:#356ae6;
  --accent2:#214bb5;
  --good:#18864b;
  --warn:#bd7b00;
  --bad:#c43d4b;
  --shadow:0 8px 28px rgba(22,32,51,.08);
  --radius:18px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

.app{
  min-height:100vh;
  padding-bottom:78px;
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#101827;
  color:#fff;
  padding:14px 16px calc(12px + env(safe-area-inset-top));
  box-shadow:0 3px 18px rgba(0,0,0,.14);
}

.topin{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  font-weight:800;
  letter-spacing:.2px;
}

.brand small{
  display:block;
  font-weight:500;
  opacity:.68;
  font-size:11px;
  margin-top:2px;
}

.top-actions{
  display:flex;
  gap:7px;
}

.iconbtn{
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);
  color:#fff;
  border-radius:12px;
  padding:9px 11px;
}

.main{
  max-width:1100px;
  margin:auto;
  padding:18px 14px;
}

.page{display:none}
.page.active{display:block}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:4px 0 14px;
}

.section-title h2{
  font-size:21px;
  margin:0;
}

.muted{color:var(--muted)}

.grid{
  display:grid;
  gap:12px;
}

.cards{
  grid-template-columns:repeat(4,1fr);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
}

.metric .label{
  font-size:12px;
  color:var(--muted);
  font-weight:650;
}

.metric .value{
  font-size:24px;
  font-weight:800;
  margin-top:7px;
  line-height:1.1;
}

.metric .sub{
  font-size:11px;
  color:var(--muted);
  margin-top:7px;
}

.positive{color:var(--good)}
.negative{color:var(--bad)}
.warning{color:var(--warn)}

.quick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:14px 0;
}

.btn{
  border:0;
  border-radius:13px;
  padding:11px 14px;
  font-weight:750;
  background:var(--accent);
  color:#fff;
}

.btn:hover{background:var(--accent2)}

.btn.secondary{
  background:#eef2f8;
  color:var(--ink);
  border:1px solid var(--line);
}

.btn.danger{
  background:#fbecee;
  color:var(--bad);
  border:1px solid #f2cdd2;
}

.btn.small{
  padding:8px 10px;
  border-radius:10px;
  font-size:13px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}

.toolbar select,
.toolbar input{
  width:auto;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:12px;
  font-weight:750;
  color:#46505e;
}

.field input,
.field select,
.field textarea,
.inputlike{
  width:100%;
  border:1px solid #d8dde5;
  background:#fff;
  border-radius:11px;
  padding:10px 11px;
  color:var(--ink);
  outline:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(53,106,230,.12);
}

textarea{
  min-height:82px;
  resize:vertical;
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.full{grid-column:1/-1}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.chip{
  border:1px solid #d8dde5;
  background:#fff;
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
}

.chip.on{
  background:#eaf0ff;
  border-color:#9db5fa;
  color:#2349ad;
  font-weight:750;
}

.checkgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.check{
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--line);
  padding:9px;
  border-radius:10px;
  background:#fafbfc;
  font-size:13px;
}

.check input{width:auto}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
}

.row-main{
  min-width:0;
}

.row-title{
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.row-sub{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.row-right{
  text-align:right;
  white-space:nowrap;
}

.amount{font-weight:800}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block;
  margin-right:5px;
  background:#999;
}

.income .dot{background:var(--good)}
.expense .dot{background:var(--bad)}

.empty{
  padding:28px;
  text-align:center;
  color:var(--muted);
  border:1px dashed #ccd2dc;
  border-radius:14px;
  background:#fafbfc;
}

.nav{
  position:fixed;
  z-index:30;
  left:0;
  right:0;
  bottom:0;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:7px max(7px,env(safe-area-inset-left))
          calc(7px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav button{
  border:0;
  background:transparent;
  color:#737b88;
  font-size:10px;
  font-weight:700;
  padding:6px 2px;
}

.nav button.active{color:var(--accent)}

.nav b{
  display:block;
  font-size:18px;
  line-height:18px;
  margin-bottom:2px;
}

.modalback{
  position:fixed;
  inset:0;
  background:rgba(8,15,28,.58);
  z-index:50;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modalback.show{display:flex}

.modal{
  width:min(760px,100%);
  max-height:94vh;
  overflow:auto;
  background:#fff;
  border-radius:22px 22px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 35px rgba(0,0,0,.2);
}

.modalhead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modalhead h3{
  margin:0;
  font-size:19px;
}

.close{
  border:0;
  background:#eef1f5;
  border-radius:10px;
  padding:7px 10px;
}

.actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:15px;
  flex-wrap:wrap;
}

.tabs{
  display:flex;
  gap:6px;
  overflow:auto;
  padding-bottom:3px;
  margin-bottom:14px;
}

.tab{
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:8px 12px;
  white-space:nowrap;
  font-size:12px;
  font-weight:700;
}

.tab.active{
  background:#eaf0ff;
  color:#244dad;
  border-color:#a9bcf5;
}

.calendar{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}

.calhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 14px;
  border-bottom:1px solid var(--line);
}

.week,
.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
}

.week div{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  font-weight:750;
  padding:9px 2px;
}

.day{
  min-height:68px;
  border-right:1px solid #eef0f3;
  border-bottom:1px solid #eef0f3;
  padding:6px;
  background:#fff;
  position:relative;
}

.day:nth-child(7n){border-right:0}

.day.mutedday{
  background:#fafbfc;
  color:#b4bac4;
}

.day.today{
  background:#f0f4ff;
}

.daynum{
  font-size:12px;
  font-weight:750;
}

.marks{
  display:flex;
  gap:3px;
  margin-top:7px;
}

.mark{
  width:7px;
  height:7px;
  border-radius:50%;
}

.mark.i{background:var(--good)}
.mark.e{background:var(--bad)}

.daytotal{
  font-size:9px;
  color:var(--muted);
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
}

.chartbox{
  height:250px;
  position:relative;
}

.chartbox canvas{
  width:100%;
  height:100%;
}

.barrow{
  display:grid;
  grid-template-columns:minmax(90px,1fr) 2fr 70px;
  gap:8px;
  align-items:center;
  margin:9px 0;
}

.bar{
  height:10px;
  background:#edf0f4;
  border-radius:999px;
  overflow:hidden;
}

.bar span{
  display:block;
  height:100%;
  background:var(--accent);
  border-radius:999px;
}

.barlabel{
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.barvalue{
  text-align:right;
  font-size:12px;
  font-weight:750;
}

.ampel{
  display:flex;
  align-items:center;
  gap:9px;
}

.light{
  width:15px;
  height:15px;
  border-radius:50%;
  background:#b9c0c9;
}

.light.green{background:var(--good)}
.light.yellow{background:#e4a526}
.light.red{background:var(--bad)}

.note{
  font-size:11px;
  color:var(--muted);
  line-height:1.45;
}

.split{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.statline{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #edf0f3;
  font-size:13px;
}

.statline:last-child{border-bottom:0}

.dangertext{color:var(--bad)}

.successbox{
  padding:10px 12px;
  border-radius:11px;
  background:#edf9f2;
  color:#176b3e;
  font-size:12px;
}

.warningbox{
  padding:10px 12px;
  border-radius:11px;
  background:#fff6df;
  color:#8a5c00;
  font-size:12px;
}

.modal .checkgrid{
  max-height:190px;
  overflow:auto;
}

.pill{
  display:inline-block;
  padding:3px 7px;
  border-radius:999px;
  background:#f0f2f5;
  font-size:10px;
  color:#616a77;
  margin:2px 2px 0 0;
}

.hidden{display:none!important}

@media(max-width:760px){
  .cards{
    grid-template-columns:1fr 1fr;
  }

  .formgrid,
  .split{
    grid-template-columns:1fr;
  }

  .barrow{
    grid-template-columns:90px 1fr 65px;
  }

  .day{
    min-height:60px;
  }

  .daytotal{
    display:none;
  }

  .main{
    padding:15px 11px;
  }

  .card{
    padding:14px;
  }

  .metric .value{
    font-size:21px;
  }
}

@media(min-width:900px){
  .nav{
    position:sticky;
    top:0;
    bottom:auto;
    max-width:1100px;
    margin:auto;
    border:0;
    background:transparent;
    backdrop-filter:none;
    grid-template-columns:repeat(5,1fr);
    padding:0 14px 10px;
  }

  .nav button{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
  }

  .app{
    padding-bottom:0;
  }

  .modalback{
    align-items:center;
  }

  .modal{
    border-radius:22px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <div class="topin">
    <div class="brand">
      FinanzPlan
      <small>einfach. übersichtlich. aktuell.</small>
    </div>

    <div class="top-actions">
      <button class="iconbtn" onclick="openSettings()">⚙</button>
    </div>
  </div>
</header>

<nav class="nav" id="nav"></nav>

<main class="main">

<section id="page-dashboard" class="page active"></section>

<section id="page-entry" class="page"></section>

<section id="page-calendar" class="page"></section>

<section id="page-analysis" class="page"></section>

<section id="page-lists" class="page"></section>

</main>
</div>

<div id="modalBack" class="modalback" onclick="backdropClose(event)">
  <div id="modal" class="modal"></div>
</div>

<input
  id="importFile"
  type="file"
  accept="application/json,.json"
  class="hidden"
>

<script>
'use strict';

const KEY='finanzplan_v1';

const defaultCats=[
  'Wohnen',
  'Lebensmittel',
  'Mobilität',
  'Auto',
  'Versicherung',
  'Freizeit',
  'Gesundheit',
  'Haushalt',
  'Urlaub',
  'Kleidung',
  'Abos',
  'Steuern',
  'Gehalt',
  'Sonstiges'
];

let state=loadState();

let ui={
  page:'dashboard',
  cal:new Date(),
  analysisPeriod:'month',
  analysisDate:new Date(),
  analysisCats:[],
  analysisType:'all',
  analysisFixed:false
};


/* =========================
   GRUNDLAGEN
========================= */

function id(){
  return (
    crypto &&
    crypto.randomUUID
  )
  ? crypto.randomUUID()
  : Date.now().toString(36)+Math.random().toString(36).slice(2);
}


function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    return normalize(s||{});
  }catch(e){
    return normalize({});
  }
}


function normalize(s){
  return {
    version:1,

    settings:Object.assign(
      {
        currency:'EUR',
        openingBalance:0,

        ampel:{
          balance:{
            green:1000,
            yellow:0
          },

          adjusted:{
            green:1000,
            yellow:0
          },

          monthExpense:{
            green:1000,
            yellow:2000
          }
        }
      },
      s.settings||{}
    ),

    categories:
      Array.isArray(s.categories) && s.categories.length
      ? s.categories
      : defaultCats.map(name=>({
          id:id(),
          name
        })),

    transactions:
      Array.isArray(s.transactions)
      ? s.transactions
      : [],

    recurring:
      Array.isArray(s.recurring)
      ? s.recurring
      : []
  };
}


function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
  }catch(e){
    alert(
      'Die Daten konnten nicht gespeichert werden. '+
      'Bitte exportiere zur Sicherheit eine Sicherung.'
    );
  }
}


function esc(x){
  return String(x??'').replace(
    /[&<>'"]/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[m])
  );
}


function money(n){
  return new Intl.NumberFormat(
    'de-DE',
    {
      style:'currency',
      currency:state.settings.currency||'EUR'
    }
  ).format(Number(n)||0);
}


function dateObj(s){
  if(s instanceof Date){
    return new Date(
      s.getFullYear(),
      s.getMonth(),
      s.getDate()
    );
  }

  const [y,m,d]=String(s).split('-').map(Number);

  return new Date(y,m-1,d);
}


function iso(d){
  d=dateObj(d);

  return `${d.getFullYear()}-${String(
    d.getMonth()+1
  ).padStart(2,'0')}-${String(
    d.getDate()
  ).padStart(2,'0')}`;
}


function today(){
  return iso(new Date());
}


function addDays(s,n){
  const d=dateObj(s);
  d.setDate(d.getDate()+n);
  return iso(d);
}


function endMonth(s){
  const d=dateObj(s);

  return iso(
    new Date(
      d.getFullYear(),
      d.getMonth()+1,
      0
    )
  );
}


function startMonth(s){
  const d=dateObj(s);

  return iso(
    new Date(
      d.getFullYear(),
      d.getMonth(),
      1
    )
  );
}


function addMonths(s,n){
  const d=dateObj(s);
  const day=d.getDate();

  d.setDate(1);
  d.setMonth(d.getMonth()+n);

  d.setDate(
    Math.min(
      day,
      new Date(
        d.getFullYear(),
        d.getMonth()+1,
        0
      ).getDate()
    )
  );

  return iso(d);
}


function fmtDate(s){
  return new Intl.DateTimeFormat(
    'de-DE',
    {
      day:'2-digit',
      month:'2-digit',
      year:'numeric'
    }
  ).format(dateObj(s));
}


function fmtMonth(s){
  return new Intl.DateTimeFormat(
    'de-DE',
    {
      month:'long',
      year:'numeric'
    }
  ).format(dateObj(s));
}


function monthName(s){
  return new Intl.DateTimeFormat(
    'de-DE',
    {
      month:'long'
    }
  ).format(dateObj(s));
}


function sum(arr,fn){
  return arr.reduce(
    (a,x)=>a+(fn?fn(x):Number(x)||0),
    0
  );
}


function catName(cid){
  return (
    state.categories.find(c=>c.id===cid)?.name
    || 'Gelöschte Kategorie'
  );
}


function catsHtml(ids){
  return (
    ids||[]
  ).map(
    c=>`<span class="pill">${esc(catName(c))}</span>`
  ).join('')
  ||
  '<span class="pill">ohne Kategorie</span>';
}


/* =========================
   NAVIGATION
========================= */

function navRender(){

  const items=[
    ['dashboard','⌂','Übersicht'],
    ['entry','＋','Erfassen'],
    ['calendar','□','Kalender'],
    ['analysis','◫','Auswertung'],
    ['lists','☷','Listen']
  ];

  document.getElementById('nav').innerHTML=
    items.map(x=>`
      <button
        class="${ui.page===x[0]?'active':''}"
        onclick="showPage('${x[0]}')"
      >
        <b>${x[1]}</b>
        ${x[2]}
      </button>
    `).join('');
}


function showPage(p){
  ui.page=p;

  render();

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}


function render(){

  navRender();

  renderDashboard();
  renderEntry();
  renderCalendar();
  renderAnalysis();
  renderLists();

  document
    .querySelectorAll('.page')
    .forEach(e=>e.classList.remove('active'));

  document
    .getElementById('page-'+ui.page)
    .classList.add('active');
}


/* =========================
   FINANZBERECHNUNG
========================= */

function actualBalance(){

  const t=today();

  return (
    Number(state.settings.openingBalance)||0
  )
  +
  sum(
    state.transactions.filter(x=>x.date<=t),
    x=>x.type==='income'
      ? Number(x.amount)
      : -Number(x.amount)
  );
}


function transBetween(a,b){
  return state.transactions.filter(
    x=>x.date>=a && x.date<=b
  );
}


/* =========================
   WIEDERKEHRENDE POSTEN
========================= */

function occurrenceDates(tpl,a,b){

  const out=[];

  let cur=dateObj(tpl.startDate);

  const end=dateObj(b);
  const from=dateObj(a);

  if(tpl.recurrence==='manual'){
    return out;
  }

  if(cur<from){

    if(tpl.recurrence==='daily'){

      cur=new Date(from);

    }else if(tpl.recurrence==='weekly'){

      const diff=Math.floor(
        (from-cur)/86400000
      );

      cur.setDate(
        cur.getDate()+
        Math.ceil(diff/7)*7
      );

    }else if(
      tpl.recurrence==='monthly' ||
      tpl.recurrence==='quarterly'
    ){

      let months=
        (from.getFullYear()-cur.getFullYear())*12+
        from.getMonth()-cur.getMonth();

      const step=
        tpl.recurrence==='quarterly'
        ? 3
        : 1;

      months=
        Math.floor(months/step)*step;

      cur=dateObj(
        addMonths(
          tpl.startDate,
          months
        )
      );

      while(cur<from){
        cur=dateObj(
          addMonths(
            iso(cur),
            step
          )
        );
      }

    }else if(tpl.recurrence==='yearly'){

      let years=
        from.getFullYear()-
        cur.getFullYear();

      cur=dateObj(
        `${cur.getFullYear()+Math.max(0,years)}-`+
        `${String(cur.getMonth()+1).padStart(2,'0')}-`+
        `${String(cur.getDate()).padStart(2,'0')}`
      );

      if(cur<from){

        cur=dateObj(
          `${cur.getFullYear()+1}-`+
          `${String(cur.getMonth()+1).padStart(2,'0')}-`+
          `${String(cur.getDate()).padStart(2,'0')}`
        );
      }
    }
  }

  let guard=0;

  while(cur<=end && guard++<5000){

    if(cur>=from){
      out.push(iso(cur));
    }

    if(tpl.recurrence==='daily'){

      cur.setDate(cur.getDate()+1);

    }else if(tpl.recurrence==='weekly'){

      cur.setDate(cur.getDate()+7);

    }else if(tpl.recurrence==='monthly'){

      cur=dateObj(
        addMonths(iso(cur),1)
      );

    }else if(tpl.recurrence==='quarterly'){

      cur=dateObj(
        addMonths(iso(cur),3)
      );

    }else if(tpl.recurrence==='yearly'){

      const m=cur.getMonth()+1;
      const d=cur.getDate();

      cur=new Date(
        cur.getFullYear()+1,
        m-1,
        d
      );

    }else{

      break;
    }
  }

  return out;
}


function virtualOccurrences(a,b){

  const rows=[];

  for(
    const r of state.recurring.filter(
      x=>x.active!==false &&
         x.recurrence!=='manual'
    )
  ){

    for(
      const d of occurrenceDates(r,a,b)
    ){

      const actual=
        state.transactions.some(
          t=>
            t.recurringTemplateId===r.id &&
            t.date===d
        );

      if(!actual){

        rows.push({
          id:'v_'+r.id+'_'+d,
          date:d,
          type:r.type,
          amount:Number(r.amount),
          description:r.name,
          notes:r.notes||'',
          categories:r.categories||[],
          recurringTemplateId:r.id,
          virtual:true,
          fixed:r.fixed
        });
      }
    }
  }

  return rows;
}


function expectedRows(a,b,type){

  const planned=
    state.transactions.filter(
      t=>
        t.date>=a &&
        t.date<=b &&
        (type?t.type===type:true)
    );

  const virtual=
    virtualOccurrences(a,b)
      .filter(
        t=>type?t.type===type:true
      );

  return planned.concat(virtual);
}


function monthlyEquivalent(r){

  const a=Number(r.amount)||0;

  switch(r.recurrence){

    case'daily':
      return a*365/12;

    case'weekly':
      return a*52/12;

    case'monthly':
      return a;

    case'quarterly':
      return a/3;

    case'yearly':
      return a/12;

    case'manual':
      return a*
        (Number(r.annualOccurrences)||0)/
        12;

    default:
      return 0;
  }
}


function recurringLabel(r){

  return ({
    daily:'täglich',
    weekly:'wöchentlich',
    monthly:'monatlich',
    quarterly:'vierteljährlich',
    yearly:'jährlich',
    manual:'unregelmäßig / manuell'
  })[r.recurrence]||'einmalig';
}

function renderCalendar(){

  const el=document.getElementById(
    'page-calendar'
  );

  const base=ui.cal;

  const first=new Date(
    base.getFullYear(),
    base.getMonth(),
    1
  );

  const last=new Date(
    base.getFullYear(),
    base.getMonth()+1,
    0
  );

  const start=
    (first.getDay()+6)%7;

  const end=last.getDate();

  const cells=[];

  for(let i=0;i<start;i++){

    const d=new Date(first);

    d.setDate(
      d.getDate()-start+i
    );

    cells.push(
      dayCell(d,true)
    );
  }

  for(
    let d=1;
    d<=end;
    d++
  ){

    cells.push(
      dayCell(
        new Date(
          base.getFullYear(),
          base.getMonth(),
          d
        ),
        false
      )
    );
  }

  while(cells.length<42){

    const d=new Date(last);

    d.setDate(
      d.getDate()+
      cells.length-
      (start+end)+1
    );

    cells.push(
      dayCell(d,true)
    );
  }

  el.innerHTML=`

    <div class="section-title">

      <div>
        <h2>Kalender</h2>
        <div class="muted">
          Buchungen nach Datum
        </div>
      </div>

        onclick="openTransaction(
          'expense',
          null,
          today()
        )"
      >
        ＋ heute
      </button>

    </div>


    <div class="calendar">

      <div class="calhead">

        <button
          class="btn small secondary"
          onclick="changeCal(-1)"
        >
          ‹
        </button>

        <strong>
          ${esc(fmtMonth(first))}
        </strong>

        <div class="toolbar">

          <button
            class="btn small secondary"
            onclick="goCalToday()"
          >
            Heute
          </button>

          <button
            class="btn small secondary"
            onclick="changeCal(1)"
          >
            ›
          </button>

        </div>

      </div>


      <div class="week">

        ${
          ['Mo','Di','Mi','Do','Fr','Sa','So']
          .map(x=>`<div>${x}</div>`)
          .join('')
        }

      </div>


      <div class="days">
        ${cells.join('')}
      </div>

    </div>


    <div
      id="dayDetail"
      style="margin-top:12px"
    ></div>
  `;
}

    return [
      iso(

          m,
          1
        )
      ),
      iso(
        new Date(
          d.getFullYear(),
          m+3,
          0
        )
      )
    ];
  }

  return [
    startMonth(d),
    endMonth(d)
  ];
}

function periodLabel(){

  const d=dateObj(
    ui.analysisDate
  );

  if(ui.analysisPeriod==='year'){
    return String(
      d.getFullYear()
    );
  }

  if(ui.analysisPeriod==='quarter'){

    return `Q${
      Math.floor(d.getMonth()/3)+1
    } ${d.getFullYear()}`;
  }

  return fmtMonth(d);
}


function setAnalysisPeriod(p){

  ui.analysisPeriod=p;

  renderAnalysis();
}


function analysisShift(n){

  if(ui.analysisPeriod==='year'){

    ui.analysisDate=
      new Date(
        ui.analysisDate.getFullYear()+n,
        ui.analysisDate.getMonth(),
        1
      );

  }else if(
    ui.analysisPeriod==='quarter'
  ){

    ui.analysisDate=
      new Date(
        ui.analysisDate.getFullYear(),
        ui.analysisDate.getMonth()+3*n,
        1
      );

  }else{

    ui.analysisDate=
      new Date(
        ui.analysisDate.getFullYear(),
        ui.analysisDate.getMonth()+n,
        1
      );
  }

  renderAnalysis();
}


function toggleAnalysisCat(c){

  ui.analysisCats=
    ui.analysisCats.includes(c)
    ?
    ui.analysisCats.filter(
      x=>x!==c
    )
    :
    ui.analysisCats.concat(c);

  renderAnalysis();
}


function calcAdjusted(){

  const t=today();

  const mEnd=endMonth(t);

  return (
    actualBalance()
    +
    sum(
      expectedRows(
        addDays(t,1),
        mEnd,
        'income'
      ),
      x=>x.amount
    )
    -
    sum(
      expectedRows(
        addDays(t,1),
        mEnd,
        'expense'
      ),
      x=>x.amount
    )
  );
}


function light(value,th){

  if(
    value>=Number(th.green)
  ){
    return 'green';
  }

  if(
    value>=Number(th.yellow)
  ){
    return 'yellow';
  }

  return 'red';
}

function drawChart(id,data){

  const c=document.getElementById(id);

  if(!c)return;

  const r=c.getBoundingClientRect();

  const dpr=
    window.devicePixelRatio||1;

  c.width=r.width*dpr;
  c.height=r.height*dpr;

  const x=c.getContext('2d');

  x.scale(dpr,dpr);

  const w=r.width;
  const h=r.height;

  const cx=w/2;
  const cy=h/2;

  const R=Math.min(w,h)*.32;
  const r0=R*.58;

  const total=
    sum(data,x=>x[1]);

  x.clearRect(
    0,
    0,
    w,
    h
  );

  if(!total){

    x.fillStyle='#77808d';
    x.textAlign='center';
    x.font='14px sans-serif';

    x.fillText(
      'Keine Daten',
      cx,
      cy
    );

    return;
  }

  let start=-Math.PI/2;

  data
    .slice(0,12)
    .forEach(
      ([cid,val],i)=>{

        const ang=
          val/total*Math.PI*2;

        x.beginPath();

        x.moveTo(
          cx,
          cy
        );

        x.arc(
          cx,
          cy,
          R,
          start,
          start+ang
        );

        x.closePath();

        x.fillStyle=
          `hsl(${
            (i*47+210)%360
          } 70% 55%)`;

        x.fill();

        start+=ang;
      }
    );

  x.globalCompositeOperation=
    'destination-out';

  x.beginPath();

  x.arc(
    cx,
    cy,
    r0,
    0,
    Math.PI*2
  );

  x.fill();

  x.globalCompositeOperation=
    'source-over';

  x.fillStyle='#152033';

  x.textAlign='center';

  x.font='700 14px sans-serif';

  x.fillText(
    money(total),
    cx,
    cy+5
  );
}

function applyTemplate(rid){

  if(!rid)return;

  const r=
    state.recurring.find(
      x=>x.id===rid
    );

  if(!r)return;

  const f=
    document.getElementById(
      'txForm'
    );

  f.amount.value=r.amount;
  f.description.value=r.name;
  f.notes.value=r.notes||'';
  f.type.value=r.type;

  f.querySelectorAll(
    'input[name="cat"]'
  ).forEach(
    c=>{
      c.checked=
        (r.categories||[])
          .includes(c.value);
    }
  );

  if(f.recurrence){

    f.recurrence.value=
      r.recurrence==='manual'
      ?'once'
      :r.recurrence;
  }
}


function saveTransaction(
  ev,
  type,
  tid
){

  ev.preventDefault();

  const f=ev.target;

  const fd=new FormData(f);

  const r=fd.get('recurrence');

  const obj={

    id:tid||id(),

    type:fd.get('type'),

    amount:
      Math.round(
        Number(fd.get('amount'))*100
      )/100,

    date:fd.get('date'),

    description:
      String(
        fd.get('description')
      ).trim(),

    notes:
      String(
        fd.get('notes')||''
      ).trim(),

    categories:
      fd.getAll('cat'),

    recurrence:r,

    recurringTemplateId:
      fd.get('template')||null,

    createdAt:
      new Date().toISOString()
  };


  if(
    !obj.amount ||
    obj.amount<0 ||
    !obj.date ||
    !obj.description
  ){

    alert(
      'Bitte Betrag, Datum und Bezeichnung prüfen.'
    );

    return false;
  }


  if(tid){

    const i=
      state.transactions.findIndex(
        x=>x.id===tid
      );

    if(i>=0){

      state.transactions[i]=
        Object.assign(
          {},
          state.transactions[i],
          obj
        );
    }

  }else{

    state.transactions.push(obj);
  }


  if(r!=='once'){

    const existing=
      obj.recurringTemplateId
      ?
      state.recurring.find(
        x=>x.id===obj.recurringTemplateId
      )
      :
      null;

    const tpl={

      id:
        existing?.id||
        id(),

      type:obj.type,

      name:obj.description,

      amount:obj.amount,

      startDate:obj.date,

      recurrence:r,

      categories:obj.categories,

      notes:obj.notes,

      fixed:
        existing?.fixed||
        false,

      active:true,

      annualOccurrences:
        existing?.annualOccurrences||
        0
    };


    if(existing){

      Object.assign(
        existing,
        tpl
      );

    }else{

      state.recurring.push(tpl);
    }


    obj.recurringTemplateId=
      tpl.id;


    const savedTx=
      state.transactions.find(
        x=>x.id===obj.id
      );

    if(savedTx){

      savedTx.recurringTemplateId=
        tpl.id;
    }
  }


  save();

  closeModal();

  render();

  return false;
}


function deleteTransaction(tid){

    )
  ){
    return;

  state.transactions=

  save();

  render();
}

function addCategory(){

  const n=
    prompt(
      'Name der neuen Kategorie:',
      'Neue Kategorie'
    );

  if(!n?.trim())return;

  if(
    state.categories.some(
      c=>
        c.name.toLowerCase()===
        n.trim().toLowerCase()
    )
  ){

    return alert(
      'Diese Kategorie gibt es bereits.'
    );
  }

  state.categories.push({
    id:id(),
    name:n.trim()
  });

  save();

  renderLists();
}


function editCategory(cid){

  const c=
    state.categories.find(
      x=>x.id===cid
    );

  if(!c)return;

  const n=
    prompt(
      'Kategoriename:',
      c.name
    );

  if(!n?.trim())return;

  c.name=n.trim();

  save();

  renderLists();
}


function deleteCategory(cid){

  if(state.categories.length<=1){

    return alert(
      'Mindestens eine Kategorie muss bestehen bleiben.'
    );
  }

  const c=
    state.categories.find(
      x=>x.id===cid
    );

  if(!c)return;

  if(
    !confirm(
      `Kategorie „${c.name}“ löschen? `+
      'Sie wird auch aus vorhandenen Buchungen '+
      'und Vorlagen entfernt.'
    )
  ){
    return;
  }

  state.categories=
    state.categories.filter(
      x=>x.id!==cid
    );

  state.transactions.forEach(
    t=>{
      t.categories=
        (t.categories||[])
        .filter(
          x=>x!==cid
        );
    }
  );

  state.recurring.forEach(
    r=>{
      r.categories=
        (r.categories||[])
        .filter(
          x=>x!==cid
        );
    }
  );

  save();

  renderLists();
}

                      r.fixed
                      ?'fest'
                      :'nicht fest'
                    }

                    ${
                      r.recurrence==='manual' &&
                      r.annualOccurrences
                      ?
                      ` · ${
                        r.annualOccurrences
                      }×/Jahr`
                      :
                      ''
                    }

                  </div>

                  <div>
                    ${catsHtml(r.categories)}
                  </div>

                </div>


                <div class="row-right">

                  <strong>
                    ${money(r.amount)}
                  </strong>

                  <div
                    class="toolbar"
                    style="
                      justify-content:flex-end;
                      margin-top:5px
                    "
                  >

                    <button
                      class="btn small secondary"
                      onclick="
                        editRecurring('${r.id}')
                      "
                    >
                      Bearbeiten
                    </button>

                    <button
                      class="btn small danger"
                      onclick="
                        deleteRecurring('${r.id}')
                      "
                    >
                      Löschen
                    </button>

                  </div>

                </div>

              </div>

            `
          )
          .join('')
        :
        `<div class="empty">
          Noch keine wiederkehrenden Posten.
        </div>`
      }

    </div>
  `;

  showModal();
}

function saveRecurring(ev,rid){

  ev.preventDefault();

  const f=ev.target;

  const fd=new FormData(f);

  const obj={

    id:rid||id(),

    type:fd.get('type'),

    amount:
      Math.round(
        Number(fd.get('amount'))*100
      )/100,

    name:
      String(
        fd.get('name')
      ).trim(),

    startDate:
      fd.get('startDate'),

    recurrence:
      fd.get('recurrence'),

    annualOccurrences:
      Number(
        fd.get('annualOccurrences')
      )||0,

    categories:
      fd.getAll('cat'),

    notes:
      String(
        fd.get('notes')||''
      ).trim(),

    fixed:
      fd.has('fixed'),

    active:true
  };


  if(
    !obj.amount ||
    !obj.name ||
    !obj.startDate
  ){

    alert(
      'Bitte Betrag, Bezeichnung und Startdatum prüfen.'
    );

    return false;
  }


  const i=
    state.recurring.findIndex(
      x=>x.id===obj.id
    );

  if(i>=0){

    state.recurring[i]=obj;

  }else{

    state.recurring.push(obj);
  }


  save();

  openRecurring();

  return false;
}


function deleteRecurring(rid){

  if(
    !confirm(
      'Diesen wiederkehrenden Posten löschen? '+
      'Bereits gespeicherte Buchungen bleiben erhalten.'
    )
  ){
    return;
  }

  state.recurring=
    state.recurring.filter(
      x=>x.id!==rid
    );

  state.transactions.forEach(
    t=>{
      if(t.recurringTemplateId===rid){
        t.recurringTemplateId=null;
      }
    }
  );

  save();

  openRecurring();
}

/* =========================
   DATENTRANSFER
========================= */

function exportData(){

  const blob=
    new Blob(
      [
        JSON.stringify(
          state,
          null,
          2
        )
      ],
      {
        type:'application/json'
      }
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement('a');

  a.href=url;

  a.download=
    `FinanzPlan-Sicherung-${today()}.json`;

  a.click();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );
}


document
  .getElementById('importFile')
  .addEventListener(
    'change',
    e=>{

      const f=e.target.files[0];

      if(!f)return;

      const r=new FileReader();

      r.onload=()=>{

        try{

          const imported=
            JSON.parse(r.result);

          if(
            !imported ||
            !Array.isArray(
              imported.transactions
            ) ||
            !Array.isArray(
              imported.categories
            ) ||
            !Array.isArray(
              imported.recurring
            )
          ){

            throw Error();
          }


          if(
            !confirm(
              'Import ersetzt den aktuellen Datenbestand. Fortfahren?'
            )
          ){

            return;
          }


          state=
            normalize(imported);

          save();

          render();

          alert(
            'Daten erfolgreich importiert.'
          );

        }catch(err){

          alert(
            'Die Datei ist keine gültige FinanzPlan-Sicherung.'
          );
        }
      };

      r.readAsText(f);

      e.target.value='';
    }
  );


function resetData(){

  if(
    !confirm(
      'Wirklich ALLE Daten löschen? '+
      'Dieser Schritt kann nur mit einer '+
      'vorherigen Sicherung rückgängig gemacht werden.'
    )
  ){

    return;
  }


  if(
    !confirm(
      'Letzte Sicherheitsabfrage: '+
      'Daten endgültig löschen?'
    )
  ){

    return;
  }


  localStorage.removeItem(KEY);

  state=
    normalize({});

  closeModal();

  render();
}

function showModal(){

  document
    .getElementById('modalBack')
    .classList.add('show');

  document.body.style.overflow='hidden';
}


function closeModal(){

  document
    .getElementById('modalBack')
    .classList.remove('show');

  document.body.style.overflow='';
}


function backdropClose(e){

  if(
    e.target.id==='modalBack'
  ){

    closeModal();
  }
}


window.addEventListener(
  'keydown',
  e=>{
    if(e.key==='Escape'){
      closeModal();
    }
  }
);
